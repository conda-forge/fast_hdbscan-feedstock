{% set name = "fast_hdbscan" %}
{% set version = "0.3.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fast_hdbscan-{{ version }}.tar.gz
  sha256: 4c9aead39c99e002a1ee8406e31ff41df5c491578cc7df8776d56547115c5acb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.6.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - numba >=0.56
    - scikit-learn >=1.1

test:
  imports:
    - fast_hdbscan
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/TutteInstitute/fast_hdbscan
  summary: A fast multicore version of hdbscan for low dimensional euclidean spaces
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apcamargo
